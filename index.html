<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d92d20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Eczane Bul">
<title>Eczane Bul</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <span>💊 Eczane Bul</span>
  <button id="btnInstall" hidden>Uygulamayı yükle</button>
</header>
<main>
  <section class="card">
    <div class="modes" role="tablist">
      <button data-mode="auto" class="on">🕒 Otomatik</button>
      <button data-mode="day">☀️ Gündüz – Tüm eczaneler</button>
      <button data-mode="night">🌙 Nöbetçi</button>
    </div>
    <div id="modeInfo" class="muted small"></div>
    <div class="row" style="margin-top:10px">
      <button class="primary" id="btnLoc">📍 Konumumu kullan</button>
      <select id="il"><option value="">İl seçin</option></select>
      <input id="ilce" placeholder="İlçe (örn. Kadıköy)">
      <button id="btnSearch">Ara</button>
    </div>
    <div id="status" class="muted small"></div>
    <details>
      <summary class="muted small">Ayarlar</summary>
      <div class="row" style="margin-top:8px">
        <input id="apikey" placeholder="CollectAPI anahtarı (boşsa nöbetçi için demo veri)">
        <select id="radius">
          <option value="1500">1,5 km</option>
          <option value="3000" selected>3 km</option>
          <option value="5000">5 km</option>
        </select>
        <button id="btnSave">Kaydet</button>
      </div>
    </details>
  </section>
  <section class="layout">
    <div class="card"><div id="list"><p class="muted">Konumunuzu kullanın veya il/ilçe seçin.</p></div></div>
    <div id="map"></div>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
</body>
</html>
