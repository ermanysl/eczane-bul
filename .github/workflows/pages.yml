# main dalına her push'ta ve her sabah (nöbetçi listesi yenilensin diye) siteyi GitHub Pages'e yayınlar.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Türkiye saatiyle 09:15
    - cron: "15 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Web dosyalarını hazırla
        run: node scripts/build.js
      - name: Nöbetçi eczaneleri güncelle
        run: node scripts/nobetci-guncelle.js
        env:
          COLLECTAPI_KEY: ${{ secrets.COLLECTAPI_KEY }}
          NOBETCI_ILLER: ${{ vars.NOBETCI_ILLER || 'İstanbul' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
